<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANI:LOG パッチツール (v2.4.5 履歴修正・完全版)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111417;
    --surface: #1a2228;
    --surface2: #202a32;
    --border: #303b43;
    --border-ctrl: #485864;
    --ink: #f0f4f2;
    --muted: #c2d0da;
    --accent: #c4e995;
    --accent-soft: rgba(196, 233, 149, 0.12);
    --accent-border: rgba(196, 233, 149, 0.4);
    --accent-ink: #182414;
    --gold: #f2c86c;
    --danger: #e6a5a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 36px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .eyebrow {
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
  }
  h1 {
    margin: 6px 0 8px;
    font-size: 22px;
  }
  p.lead {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .dropzone {
    border: 2px dashed var(--border-ctrl);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    background: var(--surface2);
    cursor: pointer;
    transition: border-color 0.16s, background 0.16s;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone input { display: none; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .status-box {
    margin-top: 20px;
    padding: 16px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .log-list {
    list-style: none;
    padding: 0;
    margin: 12px 0 0;
    display: grid;
    gap: 8px;
  }
  .log-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge.ok { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
  .badge.already { background: rgba(242, 200, 108, 0.15); color: var(--gold); border: 1px solid rgba(242, 200, 108, 0.4); }
  .badge.ng { background: rgba(230, 165, 165, 0.15); color: var(--danger); border: 1px solid rgba(230, 165, 165, 0.4); }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ANI:LOG PATCHER · v2.4.5 FIX</div>
  <h1>ANI:LOG 期間連動サジェスト＆「戻る」履歴修正パッチ (完全版)</h1>
  <p class="lead"><code>index_4.html</code>（または <code>index_3.html</code>）を選択すると、前回未適用だった「戻る」履歴管理の4箇所を含む全8項目を確実に適用し、更新済みの <code>index.html</code> を書き出します。</p>

  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".html,text/html">
    <div><strong>クリックして HTML ファイルを選択</strong> またはここにドラッグ＆ドロップ</div>
    <div style="color:var(--muted);font-size:12px;margin-top:6px">対象: index_4.html (v2.4.5) / index_3.html (v2.4.4)</div>
  </label>

  <div class="status-box" id="resultBox" hidden>
    <div id="summaryText" style="font-weight:700"></div>
    <ul class="log-list" id="logList"></ul>
    <div class="actions">
      <button type="button" class="btn" id="downloadBtn" disabled>修正済み index.html をダウンロード</button>
    </div>
  </div>
</div>

.addEventListener('pointerdown',e=>e.preventDefault());\n$('#searchSuggest').addEventListener('click',e=>{const b=e.target.closest('[data-suggest-value]');if(b)acceptSuggestion(b.dataset.suggestValue,b.dataset.suggestAllYears==='true')});\n$('#searchInput').addEventListener('keydown',e=>{const options=$$('#searchSuggest [data-suggest-value]');if($('#searchSuggest').classList.contains('hidden')||!options.length)return;\n if(e.key==='Escape'){e.preventDefault();closeSuggestions()}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();suggestionActive=(suggestionActive+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options.forEach((b,i)=>b.setAttribute('aria-selected',String(i===suggestionActive)));options[suggestionActive].scrollIntoView({block:'nearest'})}\n else if(e.key==='Enter'&&suggestionActive>=0){e.preventDefault();const sel=options[suggestionActive];acceptSuggestion(sel.dataset.suggestValue,sel.dataset.suggestAllYears==='true')}\n});\ndocument.addEventListener('click',e=>{if(!e.target.closest('.searchbox-shell'))closeSuggestions()});\n$('#cards').addEventListener('click',e=>{const fold=e.target.closest('[data-fold-status]');if(fold)toggleFold(fold.dataset.foldStatus,fold.dataset.foldPeriod);\n const progress=e.target.closest('[data-progress-id]');if(progress)changeProgress(progress.dataset.progressId,Number(progress.dataset.progressStep));const finish=e.target.closest('[data-progress-complete]');if(finish)acceptProgressCompletion(finish);});\n$('#detailView').addEventListener('change',e=>{if(e.target.matches('#completionYear, #completionMonth'))refreshCompletionDay()});\n$('#detailView').addEventListener('input',e=>{if(e.target.matches('#completionYear'))refreshCompletionDay()});\n$('#detailView').addEventListener('click',e=>{const progress=e.target.closest('[data-progress-id]');if(progress)changeProgress(progress.dataset.progressId,Number(progress.dataset.progressStep));const finish=e.target.closest('[data-progress-complete]');if(finish)acceptProgressCompletion(finish);const save=e.target.closest('[data-completion-save]');if(save)saveCompletionDate(save.dataset.completionSave);const clear=e.target.closest('[data-completion-clear]');if(clear)saveCompletionDate(clear.dataset.completionClear,true)});\nfor(const region of ['#cards','#detailView']){\n $(region).addEventListener('change',e=>{if(e.target.matches('[data-progress-input]'))commitProgressInput(e.target)});\n $(region).addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-progress-input]')){e.preventDefault();e.target.blur()}});\n}\n\n$('#searchInput').addEventListener('input',()=>{refreshSuggestions();if(mode==='saved'||(mode==='season'&&exploreStatusFilter!=='all')){render();return}\n const val=$('#searchInput').value.trim();if(!val&&query){runSeasonSearch('');return}\n});\n$('#searchSort').addEventListener('change',e=>{\n if(!['new','relevance','old'].includes(e.target.value))return;\n searchSort=e.target.value;\n try{localStorage.setItem(SEARCH_SORT_KEY,searchSort)}catch{/* browsing still works without storage */}\n if(mode==='season'&&query){sortSearchResults();render()}\n});\n$('#loadMore').addEventListener('click',()=>{if(loading)return;if(!query)page++;fetchPage(false)});\n$('#cards').addEventListener('change',e=>{const t=e.target;if(t.matches('[data-status-id]'))setStatus(t.dataset.statusId,t.value)});\n$('#cards').addEventListener('click',e=>{const t=e.target.closest('[data-state-action]');if(!t)return;\n const act=t.dataset.stateAction;\n if(act==='reload')fetchPage(true,true);\n else if(act==='search-all-years')runSeasonSearch(query||$('#searchInput').value.trim(),true);\n else if(act==='explore-all-years'){periodBeforeAutoAll={yearValue:years.value,seasonValue:$('#seasonSelect').value};years.value='all';$('#seasonSelect').value='all';syncPeriodUI();periodTouched=true;render();aniHistorySave()}\n else showSeason();\n});"
    },
    {

      "find": "  season:{year:curYear,season:curSeason,yearValue:years.value,seasonValue:$('#seasonSelect').value,touched:periodTouched,exploreStatus:exploreStatusFilter,search:$('#searchInput').value,query,searchSort,type:typeFilter},",

    },

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const resultBox = document.getElementById('resultBox');
  const summaryText = document.getElementById('summaryText');
  const logList = document.getElementById('logList');
  const downloadBtn = document.getElementById('downloadBtn');
  let patchedOutput = '';

  function applyPatches(rawText) {
    const hasCRLF = rawText.includes('\r\n');
    let text = rawText.replace(/\r\n/g, '\n');
    const logs = [];
    let appliedCount = 0;
    let alreadyCount = 0;
    let failedCount = 0;

    for (const p of PATCHES) {
      if (text.includes(p.find)) {
        text = text.replace(p.find, () => p.replace);
        appliedCount++;
        logs.push({ title: p.title, status: 'ok', label: '適用完了' });
      } else if (p.replace && text.includes(p.replace)) {
        alreadyCount++;
        logs.push({ title: p.title, status: 'already', label: '適用済み' });
      } else {
        failedCount++;
        logs.push({ title: p.title, status: 'ng', label: '対象箇所が見つかりません' });
      }
    }

    // Version bump -> v2.4.5
    const vBefore = text;
    text = text.replace(/ANI:LOG v2\.4\.[0-4]/g, 'ANI:LOG v2.4.5');
    if (text !== vBefore) {
      logs.push({ title: 'バージョン表記の更新 (→ v2.4.5)', status: 'ok', label: '更新完了' });
    } else if (text.includes('ANI:LOG v2.4.5')) {
      logs.push({ title: 'バージョン表記の更新 (→ v2.4.5)', status: 'already', label: '更新済み' });
    }

    if (hasCRLF) {
      text = text.replace(/\n/g, '\r\n');
    }
    return { text, logs, appliedCount, alreadyCount, failedCount };
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const res = applyPatches(String(reader.result || ''));
      patchedOutput = res.text;
      resultBox.hidden = false;
      logList.innerHTML = '';
      for (const item of res.logs) {
        const li = document.createElement('li');
        li.className = 'log-item';
        const span = document.createElement('span');
        span.textContent = item.title;
        const badge = document.createElement('span');
        badge.className = 'badge ' + item.status;
        badge.textContent = item.label;
        li.append(span, badge);
        logList.appendChild(li);
      }
      if (res.failedCount === 0) {
        summaryText.textContent = `全 ${PATCHES.length} 項目の確認・適用が完了しました（新規適用: ${res.appliedCount}件 / 適用済み: ${res.alreadyCount}件）`;
        summaryText.style.color = 'var(--accent)';
        downloadBtn.disabled = false;
      } else {
        summaryText.textContent = `一部項目（${res.failedCount}件）が見つかりませんでした。ファイルを確認してください。`;
        summaryText.style.color = 'var(--danger)';
        downloadBtn.disabled = res.appliedCount === 0 && res.alreadyCount === 0;
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  downloadBtn.addEventListener('click', () => {
    if (!patchedOutput) return;
    const blob = new Blob([patchedOutput], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });
})();
