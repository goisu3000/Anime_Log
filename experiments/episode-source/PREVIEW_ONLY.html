<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANI:LOG 新着表示 検討用プレビュー（実データではありません）</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#e8eef1;background:#101519}*{box-sizing:border-box}body{margin:0;padding:28px}h1{font-size:18px;margin:0 0 7px}p{margin:0 0 20px;color:#adbbc4;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{min-height:191px;height:191px;border-radius:14px;border:1px solid #344550;background:#1b252d;padding:15px;display:grid;grid-template-columns:94px minmax(0,1fr) 181px;gap:13px;align-items:center}.poster{height:144px;border-radius:6px;background:linear-gradient(150deg,#684f85,#243b52 48%,#334a3b);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:11px;text-align:center;color:#f5ecef;padding:8px}.info{min-width:0;align-self:center}.title{font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#b2bdc9;margin-top:9px;white-space:nowrap}.tags{display:flex;gap:4px;height:26px;align-items:center;margin-top:6px}.tag{font-size:11px;border:1px solid #384954;border-radius:5px;padding:3px 6px}.tools{font-size:12px;color:#b2c0cb;margin-top:9px}.aside{display:flex;flex-direction:column;justify-content:center;border-left:1px solid #344550;padding-left:14px;align-self:stretch;gap:0;min-width:0}.status{height:42px;border:1px solid #485d6b;border-radius:9px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;font-weight:650}.status .ico{color:#c1e99a}.notice-slot{height:30px;display:flex;align-items:center;min-width:0}.notice{border:0;background:transparent;color:#b9c7ce;font-size:11px;font-weight:670;padding:3px 0;white-space:nowrap;cursor:default;text-align:left}.notice.new{color:#f1c46d;cursor:pointer}.notice.new:hover{color:#ffe4a8;text-decoration:underline}.notice:focus-visible{outline:2px solid #c3eb98;outline-offset:3px}.prog-top{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:650;gap:4px;white-space:nowrap}.bar{height:5px;background:#394953;border-radius:9px;margin:6px 0;overflow:hidden}.fill{background:#bfe895;height:100%;width:0}.ops{display:flex;gap:5px;height:36px;align-items:stretch}.op{border:1px solid #405461;border-radius:6px;background:transparent;color:#e4edf2;min-width:37px;font-size:15px}.val{flex:1;border:1px solid #405461;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700}.op.plus{background:#bfe895;border-color:#bfe895;color:#1a2718}.controls{margin-top:15px;display:flex;flex-wrap:wrap;gap:8px}.controls button{border:1px solid #50626e;background:#22313a;color:#eef4f4;padding:8px 11px;border-radius:7px;cursor:pointer}.caption{font-size:11px;color:#a6b7c1;margin-top:10px}@media(max-width:920px){.grid{grid-template-columns:1fr}.card{grid-template-columns:88px minmax(0,1fr) 170px}}@media(max-width:530px){body{padding:13px}.card{height:auto;min-height:190px;grid-template-columns:73px minmax(0,1fr);grid-template-rows:auto auto;gap:10px}.poster{height:108px}.aside{grid-column:1 / -1;grid-row:2;border-left:0;border-top:1px solid #344550;padding:10px 0 0}.status{height:34px}.notice-slot{height:26px}.prog-top{font-size:11px}.ops{height:34px}.info{align-self:start}.meta{white-space:normal}}
</style></head><body><h1>ANI:LOG 話数通知 画面配置の試験</h1><p>これは実際の放送・配信データではありません。状態の変化と右側の固定スペースを確認するための、完全に独立したプレビューです。実際のANI:LOGの保存・同期・APIとは接続していません。</p>
<div id="grid" class="grid"></div><div class="controls"><button type="button" id="reset">架空データを初期状態に戻す</button><button type="button" id="next">第5話が新着した例</button></div><p class="caption">PC2列とスマホ1列の配置を比較してください。新着クリック→白表示、または＋で最新話まで追い付くと白表示になります。カード高さは新着の有無で変わりません。</p>
<script>
// Standalone preview-only copy of the pure rendering rules, no API or storage.
function deriveNotice({publishedThrough,verification,seenThrough,watched,initialized}){
 if(verification!=='confirmed-publication'||!Number.isInteger(publishedThrough)||publishedThrough<1||!initialized)return {state:'none',text:''};
 const n=Math.max(Number.isInteger(seenThrough)?seenThrough:0,Number.isInteger(watched)?watched:0);
 if(publishedThrough>n)return {state:'new',text:n+1===publishedThrough?`新着 第${publishedThrough}話`:`新着 第${n+1}〜${publishedThrough}話`};
 return {state:'seen',text:`第${publishedThrough}話まで公開`};
}
function acknowledgeNotice({publishedThrough,seenThrough}){return Math.max(seenThrough||0,publishedThrough||0)}
const defaults=[{title:'FX戦士くるみちゃん',subtitle:'2026年 · TVアニメ · 全12話',tags:['アクション'],watched:2,seen:2,published:4,initialized:true,status:'見てる'},{title:'テムパル ～アイテムの力～',subtitle:'2026年 · TVアニメ · 全12話',tags:['アクション','ファンタジー'],watched:3,seen:4,published:4,initialized:true,status:'見てる'},{title:'新着情報が未確認の作品',subtitle:'2026年 · Web配信',tags:[],watched:0,seen:0,published:null,initialized:false,status:'見てる'}];
let entries=structuredClone(defaults);
function draw(){document.querySelector('#grid').innerHTML=entries.map((e,i)=>{
 const n=deriveNotice({publishedThrough:e.published,verification:'confirmed-publication',seenThrough:e.seen,watched:e.watched,initialized:e.initialized});
 const total=12;
 return `<article class="card"><div class="poster" aria-hidden="true">作品画像<br>（架空）</div><div class="info"><div class="title">${e.title}</div><div class="meta">${e.subtitle}</div><div class="tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="tools">＋ 視聴先　✎</div></div><div class="aside"><div class="status"><span><span class="ico">▷</span> ${e.status}</span><span>⌄</span></div><div class="notice-slot">${n.state==='none'?'':n.state==='new'?`<button type="button" class="notice new" data-ack="${i}" aria-label="新着を確認済みにする">● ${n.text}</button>`:`<span class="notice">${n.text}</span>`}</div><div class="prog-top"><span>視聴進捗</span><span>${e.watched} / ${total}話</span></div><div class="bar"><div class="fill" style="width:${100*e.watched/total}%"></div></div><div class="ops"><button class="op" data-step="${i},-1">−</button><span class="val">${e.watched}</span><button class="op plus" data-step="${i},1">＋</button></div></div></article>`;
 }).join('');}
document.body.addEventListener('click',e=>{
 const ack=e.target.closest('[data-ack]');if(ack){const v=entries[Number(ack.dataset.ack)];v.seen=acknowledgeNotice({publishedThrough:v.published,seenThrough:v.seen});draw();return;}
 const step=e.target.closest('[data-step]');if(step){const [i,delta]=step.dataset.step.split(',').map(Number);entries[i].watched=Math.max(0,Math.min(12,entries[i].watched+delta));draw();}
});
document.querySelector('#reset').onclick=()=>{entries=structuredClone(defaults);draw()};
document.querySelector('#next').onclick=()=>{entries[0].published=5;entries[1].published=5;entries[2].published=5;entries[2].initialized=true;entries[2].seen=5;draw()};draw();
</script></body></html>
